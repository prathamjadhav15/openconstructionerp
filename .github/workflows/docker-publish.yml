name: Build and Publish OpenConstructionERP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/docker/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/prathamjadhav15/openconstructionerp-frontend:latest
            ghcr.io/prathamjadhav15/openconstructionerp-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
